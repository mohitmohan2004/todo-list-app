<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="todo-card">

            <h1>My To-Do List</h1>

            <p class="subtitle">
                Stay organized and get things done.
            </p>

            <div class="input-section">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                >

                <button id="addTaskBtn">
                    Add Task
                </button>

            </div>

            <div class="filters">

                <button
                    class="filter-btn active"
                    data-filter="all">
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="active">
                    Active
                </button>

                <button
                    class="filter-btn"
                    data-filter="completed">
                    Completed
                </button>

            </div>

            <ul id="taskList"></ul>

            <p id="emptyMessage" class="empty-message">
                No tasks found.
            </p>

            <div class="todo-footer">

                <span id="taskCount">
                    0 tasks remaining
                </span>

                <button id="clearCompletedBtn">
                    Clear Completed
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
